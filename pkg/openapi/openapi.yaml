          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceTodo'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/cis/{ci_id}/lifecycle:
    post:
      tags: [lifecycle]
      summary: CI 生命周期状态流转
      operationId: transitionCI
      description: |
        校验合法流转边（discovered→stock/active；purchase→stock；stock→active；
        active↔maintenance；active/maintenance→pending_retire；
        pending_retire→active/retired；retired 终态），流转落审计（action=lifecycle）。
      parameters:
        - $ref: '#/components/parameters/CIId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleTransitionRequest'
      responses:
        '200':
          description: 流转成功，返回 CI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CI'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/lifecycle/retire-candidates:
    get:
      tags: [lifecycle]
      summary: 退役候选三方会签清单
      operationId: retireCandidates
      description: |
        对全部未退役 host CI 执行三方会签判定：heartbeat_ok=心跳 7 天内仍在更新
        （last_heartbeat_at 优先，回退 updated_at）；scan_ok=近 3 次 ip_scan
        原始记录中有存活记录；cloud_ok=存在 cloud_instance_id（云侧实例存在）。
        三者全部为否时 eligible=true。
      responses:
        '200':
          description: 会签判定清单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetireCandidateListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/lifecycle/retire:
    post:
      tags: [lifecycle]
      summary: 执行退役联动
      operationId: retireCI
      description: |
        confirm=true 时执行退役联动（F-026）：状态→retired、n9e 摘除 target
        （按 ident/主 IP 匹配，需 N9E_API_URL/TOKEN）、JumpServer 禁用资产
        （凭据 type=jumpserver 或 JUMPSERVER_URL/TOKEN）、IPAM 关联 IP 置闲置
        （idle）、写审计（action=retire）与告警事件。各动作尽力执行、逐动作报告结果。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetireRequest'
      responses:
        '200':
          description: 退役联动动作结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetireResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/audit:
    get:
      tags: [audit]
      summary: 查询 CI 变更审计日志
      operationId: listAuditLogs
      description: 全部写操作（人工与采集器）的字段级变更留痕（F-004），按创建时间倒序分页
      parameters:
        - name: ci_id
          in: query
          description: 按 CI 过滤
          required: false
          schema:
            type: string
            format: uuid
        - name: operator
          in: query
          description: 按操作者用户名过滤（系统写入为 system）
          required: false
          schema:
            type: string
        - name: source
          in: query
          description: 按来源过滤（manual/n9e/lifecycle 等）
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 审计日志分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: meridian_token
      description: 登录成功后由服务端写入的 httpOnly JWT 会话 cookie
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 采集器等非浏览器客户端使用的 Bearer JWT(登录接口响应体中的 token)
  parameters:
    UserId:
      name: user_id
      in: path
      description: 用户 ID
      required: true
      schema:
        type: string
        format: uuid
    RoleId:
      name: role_id
      in: path
      description: 角色 ID
      required: true
      schema:
        type: string
        format: uuid
    ModelId:
      name: model_id
      in: path
      description: 模型 ID
      required: true
      schema:
        type: string
        format: uuid
    CIId:
      name: ci_id
      in: path
      description: CI ID
      required: true
      schema:
        type: string
        format: uuid
    PoolItemId:
      name: item_id
      in: path
      description: 发现池条目 ID
      required: true
      schema:
        type: string
        format: uuid
    CredentialId:
      name: credential_id
      in: path
      description: 凭据 ID
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      description: 采集任务 ID
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: 页码，从 1 开始
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      description: 每页条数
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    AlertId:
      name: alert_id
      in: path
      description: 告警事件 ID
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: 请求参数或校验规则不通过
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 未登录或会话已失效(错误码 UNAUTHORIZED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 已登录但缺少所需权限点(错误码 FORBIDDEN)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 资源状态冲突（如重复裁决、记录重复、区间重叠）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: JWT 会话令牌,与 httpOnly cookie 同值,供 Bearer 方式使用
        user:
          $ref: '#/components/schemas/CurrentUser'
    CurrentUser:
      type: object
      required: [id, username, display_name, roles, permissions]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        roles:
          type: array
          items:
            type: string
          description: 角色编码数组
          example: [admin]
        permissions:
          type: array
          items:
            type: string
          description: 当前用户权限点并集(如 ci:read)
          example: ["model:read", "ci:read"]
    User:
      type: object
      required: [id, username, display_name, status, roles, is_builtin, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        status:
          type: string
          enum: [active, disabled]
        roles:
          type: array
          items:
            type: string
          description: 角色编码数组
        is_builtin:
          type: boolean
          description: 是否内置账号(内置 admin 不可停用/降权)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserCreateRequest:
      type: object
      required: [username, display_name, password]
      properties:
        username:
          type: string
          minLength: 2
        display_name:
          type: string
        password:
          type: string
          format: password
          minLength: 6
        roles:
          type: array
          items:
            type: string
          description: 角色编码数组
    UserPatchRequest:
      type: object
      description: 全字段可选,仅更新传入字段
      properties:
        display_name:
          type: string
        status:
          type: string
          enum: [active, disabled]
        password:
          type: string
          format: password
          minLength: 6
          description: 传入即重置密码
        roles:
          type: array
          items:
            type: string
          description: 传入即整体替换角色分配
    UserListResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    Role:
      type: object
      required: [id, code, name, permissions, user_count, is_builtin, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: 角色编码(全局唯一)
          example: operator
        name:
          type: string
          description: 角色显示名
          example: 运维
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
          description: 权限点编码数组
          example: ["ci:read", "ci:write"]
        user_count:
          type: integer
          description: 当前关联用户数
        is_builtin:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RoleCreateRequest:
      type: object
      required: [code, name, permissions]
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
    RolePatchRequest:
      type: object
      description: 全字段可选,仅更新传入字段
      properties:
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
          description: 传入即整体替换权限点
    RoleListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    PermissionItem:
      type: object
      required: [code, name, description]
      properties:
        code:
          type: string
          description: 权限点编码(obj:act)
          example: ci:read
        name:
          type: string
          example: CI 查询
        description:
          type: string
          example: 查询 CI 列表、详情与关系
    SearchItem:
      type: object
      required: [kind, id, title, subtitle]
      properties:
        kind:
          type: string
          enum: [model, ci, ipam_prefix, ipam_ip]
          description: 资源类型
        id:
          type: string
          description: 资源 ID（CI 为 CI ID）
        title:
          type: string
          description: 主显示名（如主机名、机柜编号、模型名）
        subtitle:
          type: string
          description: 辅助信息（如所属模型、编码、CIDR）
        matched:
          type: string
          description: 命中说明（如匹配到的属性 key=value），可能为空
        model_code:
          type: string
          description: 仅 kind=ci 时返回，所属模型编码（前端据此决定跳转目标）
    SearchGroup:
      type: object
      required: [kind, label, items]
      properties:
        kind:
          type: string
          enum: [models, cis, ipam]
          description: 分组标识
        label:
          type: string
          description: 分组显示名（如 模型 / CI 实例 / IPAM）
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchItem'
    SearchResponse:
      type: object
      required: [query, groups]
      properties:
        query:
          type: string
        groups:
          type: array
          items:
            $ref: '#/components/schemas/SearchGroup'
          description: 仅包含非空分组
    DCIMRoomStat:
      type: object
      required: [room_id, name, rack_count, u_total, u_used, power_capacity_kw]
      properties:
        room_id:
          type: string
          format: uuid
          description: 机房 CI ID
        name:
          type: string
          description: 机房名称
        code:
          type: string
          description: 机房编码
        address:
          type: string
          description: 机房地址
        rack_count:
          type: integer
          description: 该机房机柜数
        u_total:
          type: integer
          description: U 位容量合计（机柜 u_capacity 之和）
        u_used:
          type: integer
          description: U 位占用合计（挂载记录 u_height 之和）
        power_capacity_kw:
          type: number
          description: 电力容量合计（kW）
    DCIMRackStat:
      type: object
      required: [rack_id, room_id, name, u_total, u_used, power_capacity_kw]
      properties:
        rack_id:
          type: string
          format: uuid
          description: 机柜 CI ID
        room_id:
          type: string
          format: uuid
          nullable: true
          description: 所属机房 CI ID，未分配机房时为 null
        name:
          type: string
          description: 机柜编号
        u_total:
          type: integer
          description: U 位容量
        u_used:
          type: integer
          description: U 位占用
        power_capacity_kw:
          type: number
          description: 电力容量（kW）
    DCIMUnassignedStat:
      type: object
      required: [rack_count, u_total, u_used, power_capacity_kw]
      properties:
        rack_count:
          type: integer
        u_total:
          type: integer
        u_used:
          type: integer
        power_capacity_kw:
          type: number
    DCIMOverview:
      type: object
      required: [room_count, rack_count, u_total, u_used, power_capacity_kw, rooms, racks, unassigned]
      properties:
        room_count:
          type: integer
        rack_count:
          type: integer
        u_total:
          type: integer
          description: 全局 U 位容量合计
        u_used:
          type: integer
          description: 全局 U 位占用合计
        power_capacity_kw:
          type: number
          description: 全局电力容量合计（kW）
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/DCIMRoomStat'
        racks:
          type: array
          items:
            $ref: '#/components/schemas/DCIMRackStat'
          description: 逐机柜明细（前端分组展示用，避免 N+1 请求）
        unassigned:
          $ref: '#/components/schemas/DCIMUnassignedStat'
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 机器可读错误码
          example: VALIDATION_FAILED
        message:
          type: string
          description: 人类可读错误信息
          example: 属性 hostname 为必填项
        details:
          type: object
          additionalProperties: true
          description: 逐字段校验错误等补充信息
    AttributeDefinition:
      type: object
      required: [name, code, type]
      properties:
        name:
          type: string
          description: 属性显示名
          example: 主机名
        code:
          type: string
          description: 属性编码（模型内唯一）
          example: hostname
        type:
          type: string
          enum: [string, number, bool, enum, ip, date]
          description: 属性数据类型
        required:
          type: boolean
          default: false
          description: 是否必填
        unique:
          type: boolean
          default: false
          description: 是否模型内唯一
        enum_values:
          type: array
          items:
            type: string
          description: type 为 enum 时的候选值
        regex:
          type: string
          description: 字符串格式校验正则
        source:
          type: string
          description: 属性来源（人工/采集器标识）
          example: n9e
    RelationDefinition:
      type: object
      required: [name, code, target_model, cardinality, direction]
      properties:
        name:
          type: string
          description: 关系显示名
          example: 运行于
        code:
          type: string
          description: 关系编码（模型内唯一）
          example: runs_on
        target_model:
          type: string
          description: 对端模型编码
          example: host
        cardinality:
          type: string
          enum: [one_to_one, one_to_many, many_to_many]
          description: 基数约束
        direction:
          type: string
          enum: [outgoing, incoming]
          description: 关系方向（相对本模型）
    Model:
      type: object
      required: [id, name, code, attributes, relations, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: 模型 ID
        name:
          type: string
          description: 模型显示名
          example: 主机
        code:
          type: string
          description: 模型编码（全局唯一）
          example: host
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeDefinition'
        relations:
          type: array
          items:
            $ref: '#/components/schemas/RelationDefinition'
        reconcile_keys:
          type: array
          items:
            type: string
          description: 有序调和键（属性编码数组）。首键为主键——命中即确认同一实体执行更新；其余为辅助键——命中但主键不符时判定冲突转发现池。示例 ["ident","ip"]，仅自动发现入库的模型需要配置
          example: [ident, ip]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ModelCreateRequest:
      type: object
      required: [name, code]
      properties:
        name:
          type: string
        code:
          type: string
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeDefinition'
        relations:
          type: array
          items:
            $ref: '#/components/schemas/RelationDefinition'
        reconcile_keys:
          type: array
          items:
            type: string
          description: 有序调和键，语义同 Model.reconcile_keys
    ModelPatchRequest:
      type: object
      description: 全字段可选，仅更新传入字段
      properties:
        name:
          type: string
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeDefinition'
        relations:
          type: array
          items:
            $ref: '#/components/schemas/RelationDefinition'
        reconcile_keys:
          type: array
          items:
            type: string
          description: 有序调和键，语义同 Model.reconcile_keys
    ModelListResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Model'
        total:
          type: integer
          description: 符合条件的总条数
        page:
          type: integer
        page_size:
          type: integer
    CI:
      type: object
      required: [id, model_id, attributes, status, source, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: CI ID
        model_id:
          type: string
          format: uuid
          description: 所属模型 ID
        attributes:
          type: object
          additionalProperties: true
          description: 属性键值对，键为属性编码，取值须通过模型校验规则
        status:
          type: string
          enum: [discovered, active, retired]
          description: 生命周期状态
        source:
          type: string
          description: 建档来源（manual/采集器标识）
          example: n9e
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CICreateRequest:
      type: object
      required: [model_id, attributes]
      properties:
        model_id:
          type: string
          format: uuid
        attributes:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [discovered, active, retired]
          default: active
        source:
          type: string
          default: manual
    CIPatchRequest:
      type: object
      description: 全字段可选，attributes 为增量合并
      properties:
        attributes:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [discovered, active, retired]
        source:
          type: string
    CIListResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CI'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    CIRelation:
      type: object
      required: [relation_code, direction, peer_ci]
      properties:
        relation_code:
          type: string
          description: 关系编码
          example: runs_on
        direction:
          type: string
          enum: [outgoing, incoming]
          description: 相对当前 CI 的方向
        peer_ci:
          $ref: '#/components/schemas/CI'
    CIRelationCreateRequest:
      type: object
      required: [relation_code, peer_ci_id]
      properties:
        relation_code:
          type: string
          description: 关系编码（须在所属模型的关系定义内）
          example: located_in
        peer_ci_id:
          type: string
          format: uuid
          description: 对端 CI ID（其模型须匹配关系定义的 target_model）
    DiscoveryRecord:
      type: object
      required: [source, collector, model_candidate, attributes, occurred_at]
      properties:
        source:
          type: string
          description: 发现来源系统
          example: n9e
        collector:
          type: string
          description: 采集器标识
          example: n9e-target-puller
        model_candidate:
          type: string
          description: 候选模型编码，调和引擎据此匹配
          example: host
        attributes:
          type: object
          additionalProperties: true
          description: 采集到的原始属性键值对
        occurred_at:
          type: string
          format: date-time
          description: 采集发生时间
    DiscoveryRecordBatchRequest:
      type: object
      required: [records]
      properties:
        records:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DiscoveryRecord'
    DiscoveryRecordBatchResponse:
      type: object
      required: [accepted, rejected, errors]
      properties:
        accepted:
          type: integer
          description: 已接收条数
        rejected:
          type: integer
          description: 因校验失败被拒绝条数
        errors:
          type: array
          items:
            type: object
            required: [index, message]
            properties:
              index:
                type: integer
                description: 被拒绝记录在请求数组中的下标
              message:
                type: string
    ReconcilePreviewRequest:
      type: object
      required: [record]
      properties:
        record:
          $ref: '#/components/schemas/DiscoveryRecord'
    ReconcilePreviewResult:
      type: object
      required: [action, reasons]
      properties:
        action:
          type: string
          enum: [create, update, conflict, pool]
          description: 调和判定动作：新建/更新/冲突/入发现池
        matched_ci_id:
          type: string
          format: uuid
          nullable: true
          description: 命中的存量 CI ID（action 为 update/conflict 时给出）
        reasons:
          type: array
          items:
            type: string
          description: 判定依据（命中的匹配键、规则等）
          example: ["ident+IP 命中主机 ci-xxx", "属性 ip 发生变更"]
    DiscoveryPoolItem:
      type: object
      required: [id, source, collector, model_candidate, attributes, reconcile_action, reasons, status, created_at]
      description: 发现池条目：原始发现记录 + 调和判定结果 + 人工裁决状态
      properties:
        id:
          type: string
          format: uuid
          description: 池条目 ID
        source:
          type: string
          description: 发现来源系统
          example: nmap
        collector:
          type: string
          description: 采集器标识
          example: nmap-scanner
        model_candidate:
          type: string
          description: 候选模型编码
          example: host
        attributes:
          type: object
          additionalProperties: true
          description: 采集到的原始属性键值对
        reconcile_action:
          type: string
          enum: [conflict, pool]
          description: 调和判定动作（conflict=与存量冲突，pool=暂无法调和）
        reasons:
          type: array
          items:
            type: string
          description: 判定依据
        status:
          type: string
          enum: [pending, confirmed, ignored]
          description: 裁决状态（pending 待裁决，confirmed 已确认建档，ignored 已忽略）
        created_at:
          type: string
          format: date-time
    DiscoveryPoolListResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveryPoolItem'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    DiscoveryPoolConfirmRequest:
      type: object
      description: 全字段可选；缺省时沿用池条目记录的候选模型与采集属性
      properties:
        model_id:
          type: string
          description: 目标模型（ID 或编码），默认取池条目的 model_candidate
        attributes:
          type: object
          additionalProperties: true
          description: 属性增量覆盖（合并发现属性后强制走模型校验）
    Credential:
      type: object
      required: [id, name, type, description, use_count, created_at, updated_at]
      description: 凭据元数据（F-005）。secret 以 AES-256-GCM 密文落库，任何响应永不回明文
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: 凭据名称
        type:
          type: string
          enum: [vcenter, aliyun, volc, snmp, db, kubeconfig, ssh_ipmi, n9e, netbox]
          description: 凭据类型
        description:
          type: string
        last_rotated_at:
          type: string
          format: date-time
          nullable: true
          description: 最近轮换时间
        use_count:
          type: integer
          description: 被采集任务使用次数
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CredentialCreateRequest:
      type: object
      required: [name, type, secret]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [vcenter, aliyun, volc, snmp, db, kubeconfig, ssh_ipmi, n9e, netbox]
        description:
          type: string
        secret:
          type: object
          additionalProperties: true
          description: secret 明文 JSON（仅请求体传入，服务端加密落库后不可读回）
    CredentialPatchRequest:
      type: object
      description: 仅非密字段可改
      properties:
        name:
          type: string
        description:
          type: string
    CredentialRotateRequest:
      type: object
      required: [secret]
      properties:
        secret:
          type: object
          additionalProperties: true
          description: 新 secret 明文 JSON
    CredentialListResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Credential'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    CredentialAudit:
      type: object
      required: [id, action, operator, source, created_at]
      description: 凭据操作审计（create/update/rotate/use）
      properties:
        id:
          type: string
          format: uuid
        credential_id:
          type: string
          format: uuid
        action:
          type: string
          enum: [create, update, rotate, use]
        operator:
          type: string
          description: 操作者用户名（任务使用场景为 system）
        source:
          type: string
          description: 来源（manual 或 task:<任务名>）
        created_at:
          type: string
          format: date-time
    CredentialAuditListResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CredentialAudit'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    DiscoveryTask:
      type: object
      required: [id, name, collector_type, interval_seconds, enabled, config, status, run_count, fail_count, created_at, updated_at]
      description: 采集任务（F-033）
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        collector_type:
          type: string
          description: builtin:n9e-consumer 或 exec:<binary>
          example: builtin:n9e-consumer
        credential_id:
          type: string
          format: uuid
          nullable: true
          description: 关联凭据（执行时解密 secret 注入）
        interval_seconds:
          type: integer
          minimum: 10
          description: 调度间隔秒数（调度粒度 10 秒）
        enabled:
          type: boolean
        config:
          type: object
          additionalProperties: true
          description: 执行器配置（builtin 需 api_url；exec 需 binary/args/env/timeout_seconds）
        status:
          type: string
          enum: [idle, running, error]
        last_run_at:
          type: string
          format: date-time
          nullable: true
        last_success_at:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string
          description: 最近错误摘要（截断）
        run_count:
          type: integer
        fail_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DiscoveryTaskCreateRequest:
      type: object
      required: [name, collector_type]
      properties:
        name:
          type: string
        collector_type:
          type: string
          description: builtin:n9e-consumer 或 exec:<binary>
        credential_id:
          type: string
          format: uuid
        interval_seconds:
          type: integer
          minimum: 10
          default: 300
        enabled:
          type: boolean
          default: false
        config:
          type: object
          additionalProperties: true
    DiscoveryTaskPatchRequest:
      type: object
      description: 全字段可选（增量修改）；credential_id 传空串表示解除凭据关联
      properties:
        name:
          type: string
        collector_type:
          type: string
        credential_id:
          type: string
        interval_seconds:
          type: integer
          minimum: 10
        enabled:
          type: boolean
        config:
          type: object
          additionalProperties: true
    DiscoveryTaskListResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveryTask'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    DiscoveryTaskRun:
      type: object
      required: [id, task_id, trigger, started_at, success, produced]
      description: 一次任务执行记录
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        trigger:
          type: string
          enum: [schedule, manual]
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        success:
          type: boolean
        produced:
          type: integer
          description: 摄入接受的发现记录条数（exec 执行器经 CMDB_PRODUCED=<n> 输出行声明）
        error_summary:
          type: string
          description: 失败摘要（截断 1000 字节）
        output:
          type: string
          description: stdout/stderr 合并输出尾巴（截断 4KB，exec 执行器）
    DiscoveryTaskRunListResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveryTaskRun'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    AlertEvent:
      type: object
      required: [id, level, title, source, detail, acknowledged, created_at]
      description: 告警事件（2B）：服务端检测点写入的风险线索（如黑设备主机），可经 ack 确认
      properties:
        id:
          type: string
          format: uuid
        level:
          type: string
          enum: [info, warning, critical]
          description: 告警级别
        title:
          type: string
          description: 告警标题
          example: 发现黑设备风险主机
        source:
          type: string
          description: 产生来源（发现来源系统 / 采集器标识）
          example: ipscan
        ci_id:
          type: string
          description: 关联 CI（可空，如网段级告警无单一 CI）
        detail:
          type: string
          description: 详细说明
        acknowledged:
          type: boolean
          description: 是否已确认
        created_at:
          type: string
          format: date-time
    AlertListResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AlertEvent'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    OxidizedEventRequest:
      type: object
      required: [node, event, time]
      description: Oxidized webhook 事件报文（F-062）
      properties:
        node:
          type: string
          description: 设备名（匹配 network_device CI 的 name/hostname 属性）
          example: bj-core-sw-01
        event:
          type: string
          enum: [backup, change]
          description: 事件类型（配置备份完成 / 配置变更）
        time:
          type: string
          format: date-time
          description: 事件时间（RFC3339）
        user:
          type: string
          description: 变更操作者（change 事件可带）
    OxidizedEventResponse:
      type: object
      required: [status, ci_id, idempotent]
      properties:
        status:
          type: string
          example: ok
        ci_id:
          type: string
          format: uuid
          description: 命中的 network_device CI
        idempotent:
          type: boolean
          description: 是否命中幂等去重（同时间戳重复 backup 推送）
    N9EWritebackRequest:
      type: object
      properties:
        dry_run:
          type: boolean
          description: 演练模式（只统计不调用 n9e 写接口、不落告警）
          default: false
    N9EWritebackResponse:
      type: object
      required: [updated, skipped, todos, errors]
      properties:
        updated:
          type: integer
          description: 成功回写 tags/note 的主机数
        skipped:
          type: integer
          description: 跳过的主机数（无 ident、n9e 无此 target、无可回写属性）
        todos:
          type: integer
          description: 未归组主机数（生成治理待办告警）
        errors:
          type: array
          items:
            type: string
          description: '逐主机回写失败明细（"ident: 原因"）'
    N9EDashboardURLResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: n9e 主机仪表盘 URL（前端 iframe 嵌入）
          example: http://n9e:17000/dashboards/host?ident=web-01
    AttributionRunRequest:
      type: object
      properties:
        dry_run:
          type: boolean
          description: 演练模式（只统计不落关系）
          default: false
        rules:
          type: object
          properties:
            group_map:
              type: object
              additionalProperties:
                type: string
              description: 业务组/命名段 → biz_app code 映射（整体覆盖默认映射）
    AttributionRunResponse:
      type: object
      required: [matched, rules_hit, unmatched]
      properties:
        matched:
          type: integer
          description: 成功挂接的主机数
        rules_hit:
          type: object
          description: 各规则命中次数（tag_inherit/group_map/naming）
          properties:
            tag_inherit:
              type: integer
            group_map:
              type: integer
            naming:
              type: integer
        unmatched:
          type: array
          items:
            type: string
          description: 未命中任何规则的主机 ident
    ModelQuality:
      type: object
      description: 单模型质量指标快照（F-080）
      required: [model_id, code, name, completeness, relation_completeness, orphan_count, stale_pct]
      properties:
        model_id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        completeness:
          type: number
          description: 属性完整率 0-100（Core=必填属性非空单元格占比）
        relation_completeness:
          type: number
          description: 关联完整率 0-100（host 特化为业务归属占比）
        orphan_count:
          type: integer
          description: 孤岛 CI 数（无任何关系）
        stale_pct:
          type: number
          description: 数据鲜度超期占比 0-100（updated_at 超 7 天）
        no_heartbeat_pct:
          type: number
          description: 仅 host：超 10 分钟无心跳占比 0-100
    MonitorQuality:
      type: object
      description: 监控覆盖率双指标（host 域）
      required: [no_heartbeat_pct]
      properties:
        no_heartbeat_pct:
          type: number
          description: CMDB 在用主机无心跳占比 0-100
        no_ci_pct:
          type: number
          description: n9e targets 无 CMDB CI 占比 0-100（n9e 未配置时缺省）
    QualityReport:
      type: object
      required: [models, monitor]
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelQuality'
        monitor:
          $ref: '#/components/schemas/MonitorQuality'
    AuditRule:
      type: object
      description: |
        稽核规则（F-081）。assertion 为声明式断言表达式，语法：
        比较（==/!=/>/>=/</<=/contains）、逻辑（and/or/not/括号）、
        函数（empty(attr)/not_empty(attr)/age_days(attr)/unique(attr)/biz_attributed()）、
        裸属性名真值判断（非空即真）。filter 为 CI 属性等值过滤（如 {"env":"prod"}）。
      required: [id, name, model_code, filter, assertion, message, enabled, dry_run]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        model_code:
          type: string
          description: 目标模型编码（如 host）
        filter:
          type: object
          description: CI 属性等值过滤条件，空对象表示模型内全部 CI
        assertion:
          type: string
          example: not_empty(cluster_name) and backup_count > 0
        message:
          type: string
          description: 违规时生成待办的标题
        enabled:
          type: boolean
        dry_run:
          type: boolean
          description: 演练模式：只出报告不产生/关闭待办
        last_run_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AuditRuleRequest:
      type: object
      description: 规则创建/修改请求（PATCH 时全字段可选）
      required: [name, model_code, assertion, message]
      properties:
        name:
          type: string
        model_code:
          type: string
        filter:
          type: object
        assertion:
          type: string
        message:
          type: string
        enabled:
          type: boolean
        dry_run:
          type: boolean
    AuditRuleListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditRule'
    AuditRuleViolation:
      type: object
      required: [ci_id, title]
      properties:
        ci_id:
          type: string
          format: uuid
        title:
          type: string
    AuditRuleRunResult:
      type: object
      required: [rule_id, rule_name, dry_run, checked, violations, todos_created, todos_closed]
      properties:
        rule_id:
          type: string
          format: uuid
        rule_name:
          type: string
        dry_run:
          type: boolean
        checked:
          type: integer
          description: 参与检查的 CI 数
        violations:
          type: array
          items:
            $ref: '#/components/schemas/AuditRuleViolation'
        todos_created:
          type: integer
        todos_closed:
          type: integer
    GovernanceTodo:
