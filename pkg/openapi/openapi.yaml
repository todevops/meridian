          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/governance/rules/{rule_id}:
    patch:
      tags: [governance]
      summary: 修改稽核规则
      operationId: patchAuditRule
      parameters:
        - name: rule_id
          in: path
          required: true
