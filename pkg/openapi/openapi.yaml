openapi: 3.0.3
info:
  title: CMDB API
  version: 0.1.0
  description: 纯自研 CMDB 核心 API 契约，契约先行，前后端据此并行开发
servers:
  - url: /
    description: 相对路径（与后端同域部署）
tags:
  - name: auth
    description: 身份认证（登录/登出/当前用户）
  - name: users
    description: 用户管理（需 user:manage 权限）
  - name: roles
    description: 角色与权限点（需 role:manage 权限）
  - name: models
    description: 模型定义（模型/属性/关系元数据）
  - name: cis
    description: CI 实例与关系查询
  - name: discovery
    description: 发现记录写入
  - name: reconcile
    description: 调和引擎
  - name: discovery-pool
    description: 发现池（待人工裁决的发现记录）
  - name: dcim
    description: DCIM（机房/机柜/U 位/容量）
  - name: credentials
    description: 凭据纳管（F-005，密文存储，永不回明文）
  - name: discovery-tasks
    description: 采集任务（F-033，周期调度与手动触发）
  - name: alerts
    description: 告警事件（2B，黑设备等风险线索的查询与确认）
  - name: dashboard
    description: 数据质量看板（F-080，五指标与下钻缺失清单）
  - name: governance
    description: 稽核规则与整改待办（F-081）
  - name: lifecycle
    description: CI 生命周期（F-026，状态流转/退役会签/退役联动）
  - name: audit
    description: 审计日志查询（F-004）
# 全局认证要求：除 /api/v1/auth/login 与未列入契约的健康检查外，所有接口需携带会话
security:
  - cookieAuth: []
  - bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 用户名密码登录
      operationId: login
      security: []
      description: 校验通过后签发 JWT,写入 httpOnly cookie(meridian_token),同时返回当前用户信息;客户端也可从响应体取 token 走 Bearer 方式
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: 退出登录
      operationId: logout
      description: 清除会话 cookie(JWT 无状态,服务端不做吊销)
      responses:
        '200':
          description: 已退出
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: 查询当前登录用户
      operationId: getCurrentUser
      responses:
        '200':
          description: 当前用户信息(含角色与权限点并集)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/users:
    get:
      tags: [users]
      summary: 查询用户列表
      operationId: listUsers
      parameters:
        - name: keyword
          in: query
          description: 按用户名或显示名模糊过滤
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 用户分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [users]
      summary: 创建用户
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '200':
          description: 创建成功,返回完整用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/users/{user_id}:
    get:
      tags: [users]
      summary: 查询用户详情
      operationId: getUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 用户详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [users]
      summary: 更新用户(显示名/状态/重置密码/角色分配)
      operationId: patchUser
      description: 内置 admin 用户(is_builtin=true)不允许停用、不允许移除 admin 角色
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatchRequest'
      responses:
        '200':
          description: 更新成功,返回完整用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/roles:
    get:
      tags: [roles]
      summary: 查询角色列表
      operationId: listRoles
      responses:
        '200':
          description: 角色列表(含权限点与用户数)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [roles]
      summary: 创建角色
      operationId: createRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreateRequest'
      responses:
        '200':
          description: 创建成功,返回完整角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/roles/{role_id}:
    get:
      tags: [roles]
      summary: 查询角色详情
      operationId: getRole
      parameters:
        - $ref: '#/components/parameters/RoleId'
      responses:
        '200':
          description: 角色详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [roles]
      summary: 更新角色(名称/描述/权限点)
      operationId: patchRole
      description: 内置角色(is_builtin=true)的 code 不可修改;内置 admin 角色的权限点不可修改
      parameters:
        - $ref: '#/components/parameters/RoleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolePatchRequest'
      responses:
        '200':
          description: 更新成功,返回完整角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [roles]
      summary: 删除角色
      operationId: deleteRole
      description: 内置角色不可删除;仍有用户关联的角色不可删除
      parameters:
        - $ref: '#/components/parameters/RoleId'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/permissions:
    get:
      tags: [roles]
      summary: 查询权限点目录
      operationId: listPermissions
      description: 返回系统全部权限点(固定目录,角色编辑界面据此渲染勾选项)
      responses:
        '200':
          description: 权限点列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PermissionItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/models:
    get:
      tags: [models]
      summary: 查询模型列表
      operationId: listModels
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: keyword
          in: query
          description: 按名称或编码模糊过滤
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 模型分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [models]
      summary: 创建模型
      operationId: createModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelCreateRequest'
      responses:
        '200':
          description: 创建成功，返回完整模型
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/models/{model_id}:
    get:
      tags: [models]
      summary: 查询模型详情
      operationId: getModel
      parameters:
        - $ref: '#/components/parameters/ModelId'
      responses:
        '200':
          description: 模型详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [models]
      summary: 更新模型（部分字段）
      operationId: patchModel
      parameters:
        - $ref: '#/components/parameters/ModelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelPatchRequest'
      responses:
        '200':
          description: 更新成功，返回完整模型
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/cis:
    get:
      tags: [cis]
      summary: 查询 CI 列表（支持模型过滤、关键字搜索与分页）
      operationId: listCIs
      parameters:
        - name: model_id
          in: query
          description: 按所属模型过滤
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: 按状态过滤
          required: false
          schema:
            type: string
            enum: [discovered, active, retired]
        - name: keyword
          in: query
          description: 全文关键字（匹配全部属性值，大小写不敏感）
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: CI 分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CIListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [cis]
      summary: 创建 CI
      operationId: createCI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CICreateRequest'
      responses:
        '200':
          description: 创建成功，返回完整 CI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CI'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/cis/{ci_id}:
    get:
      tags: [cis]
      summary: 查询 CI 详情
      operationId: getCI
      parameters:
        - $ref: '#/components/parameters/CIId'
      responses:
        '200':
          description: CI 详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CI'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [cis]
      summary: 更新 CI（部分字段）
      operationId: patchCI
      parameters:
        - $ref: '#/components/parameters/CIId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CIPatchRequest'
      responses:
        '200':
          description: 更新成功，返回完整 CI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CI'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/cis/{ci_id}/relations:
    get:
      tags: [cis]
      summary: 查询 CI 的关系列表
      operationId: listCIRelations
      parameters:
        - $ref: '#/components/parameters/CIId'
      responses:
        '200':
          description: 关系列表（含对端 CI 摘要）
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CIRelation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [cis]
      summary: 创建 CI 关系
      operationId: createCIRelation
      description: 在当前 CI 与对端 CI 间建立关系；关系编码须在所属模型的关系定义内，对端 CI 模型须匹配 target_model。cardinality 为 one_to_one 时自动替换同编码同方向的既有关系（用于改挂，如机柜换机房）
      parameters:
        - $ref: '#/components/parameters/CIId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CIRelationCreateRequest'
      responses:
        '200':
          description: 创建成功，返回关系（含对端 CI 摘要）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CIRelation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/cis/{ci_id}/relations/{relation_code}/{peer_ci_id}:
    delete:
      tags: [cis]
      summary: 删除 CI 关系
      operationId: deleteCIRelation
      parameters:
        - $ref: '#/components/parameters/CIId'
        - name: relation_code
          in: path
          description: 关系编码
          required: true
          schema:
            type: string
        - name: peer_ci_id
          in: path
          description: 对端 CI ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/discovery-records:
    post:
      tags: [discovery]
      summary: 批量写入发现记录
      operationId: createDiscoveryRecords
      description: 采集器上报标准发现记录，服务端接收后写入 JetStream 等待调和
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoveryRecordBatchRequest'
      responses:
        '200':
          description: 批量接收结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryRecordBatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/reconcile/preview:
    post:
      tags: [reconcile]
      summary: 调和预览（不实际落库）
      operationId: previewReconcile
      description: 对一条发现记录执行调和规则演练，返回将发生的动作与依据，便于规则调试
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcilePreviewRequest'
      responses:
        '200':
          description: 调和预览结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconcilePreviewResult'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/discovery-pool:
    get:
      tags: [discovery-pool]
      summary: 查询发现池列表
      operationId: listDiscoveryPool
      description: 调和判定为冲突或暂无法调和的发现记录在此等待人工裁决，列表关联原始记录与调和结果
      parameters:
        - name: status
          in: query
          description: 按裁决状态过滤
          required: false
          schema:
            type: string
            enum: [pending, confirmed, ignored]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 发现池分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryPoolListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/discovery-pool/{item_id}/confirm:
    post:
      tags: [discovery-pool]
      summary: 确认池条目并建档 CI
      operationId: confirmDiscoveryPoolItem
      description: 以池条目的发现属性（可被 body 覆盖）创建 status=active 的 CI，并把池条目置 confirmed
      parameters:
        - $ref: '#/components/parameters/PoolItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoveryPoolConfirmRequest'
      responses:
        '201':
          description: 建档成功，返回完整 CI（status=active）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CI'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/discovery-pool/{item_id}/ignore:
    post:
      tags: [discovery-pool]
      summary: 忽略池条目
      operationId: ignoreDiscoveryPoolItem
      description: 把池条目置 ignored（不建档），仅 pending 状态可操作
      parameters:
        - $ref: '#/components/parameters/PoolItemId'
      responses:
        '200':
          description: 忽略成功，返回更新后的池条目
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryPoolItem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/search:
    get:
      tags: [cis]
      summary: 全局全文搜索
      operationId: globalSearch
      description: 跨模型、CI、IPAM 前缀/IP 的统一搜索入口（landing 页全局搜索框）。结果按资源类型分组，每组上限由 limit 控制；无对应权限点的分组自动省略（如用户无 ipam:read 则不返回 IPAM 组）
      parameters:
        - name: q
          in: query
          description: 搜索关键字（大小写不敏感，子串匹配）
          required: true
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          description: 每组返回上限，默认 10、最大 50
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: 分组搜索结果（仅返回非空分组）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/dcim/overview:
    get:
      tags: [dcim]
      summary: DCIM 容量总览
      operationId: getDCIMOverview
      description: 按机房聚合机柜数量、U 位容量/占用与电力容量，并给出全局合计；未分配机房的机柜单独归入 unassigned
      responses:
        '200':
          description: 容量总览
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DCIMOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/credentials:
    get:
      tags: [credentials]
      summary: 查询凭据列表
      operationId: listCredentials
      description: 凭据元数据分页列表（secret 密文存储，任何响应永不回明文）
      parameters:
        - name: type
          in: query
          description: 按凭据类型过滤
          required: false
          schema:
            type: string
            enum: [vcenter, aliyun, volc, snmp, db, kubeconfig, ssh_ipmi, n9e, netbox]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 凭据分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [credentials]
      summary: 创建凭据
      operationId: createCredential
      description: secret 明文仅在请求体传入，服务端以 AES-256-GCM 加密后落库并记 create 审计
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialCreateRequest'
      responses:
        '201':
          description: 创建成功，返回凭据元数据（不含 secret）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/credentials/{credential_id}:
    patch:
      tags: [credentials]
      summary: 修改凭据非密字段
      operationId: patchCredential
      description: 仅可修改 name/description；修改 secret 请走轮换接口
      parameters:
        - $ref: '#/components/parameters/CredentialId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialPatchRequest'
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/credentials/{credential_id}/rotate:
    post:
      tags: [credentials]
      summary: 轮换凭据 secret
      operationId: rotateCredential
      description: 以新 secret 重新加密落库、刷新 last_rotated_at 并记 rotate 审计
      parameters:
        - $ref: '#/components/parameters/CredentialId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialRotateRequest'
      responses:
        '200':
          description: 轮换成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/credentials/{credential_id}/audits:
    get:
      tags: [credentials]
      summary: 查询凭据审计记录
      operationId: listCredentialAudits
      description: 凭据操作审计（create/update/rotate/use），含操作者、来源（人工或任务）与时间
      parameters:
        - $ref: '#/components/parameters/CredentialId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 审计分页列表（按时间倒序）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialAuditListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/discovery/tasks:
    get:
      tags: [discovery-tasks]
      summary: 查询采集任务列表
      operationId: listDiscoveryTasks
      description: 采集任务分页列表，含调度状态与最近执行信息
      parameters:
        - name: enabled
          in: query
          description: 按启用状态过滤
          required: false
          schema:
            type: string
            enum: ['true', 'false']
        - name: collector_type
          in: query
          description: 按采集器类型精确过滤
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 任务分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryTaskListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [discovery-tasks]
      summary: 创建采集任务
      operationId: createDiscoveryTask
      description: collector_type 为 builtin:n9e-consumer（进程内 n9e 消费）或 exec:<binary>（白名单目录内二进制，凭据 secret 以大写键名注入环境变量）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoveryTaskCreateRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryTask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/discovery/tasks/{task_id}:
    patch:
      tags: [discovery-tasks]
      summary: 修改采集任务
      operationId: patchDiscoveryTask
      description: 增量修改任务字段；运行中不允许修改 collector_type
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoveryTaskPatchRequest'
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryTask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/discovery/tasks/{task_id}/run:
    post:
      tags: [discovery-tasks]
      summary: 手动触发任务执行
      operationId: runDiscoveryTask
      description: 同步执行一次任务并返回执行记录；执行器层面的失败（采集报错/超时）以 success=false 落执行记录返回；任务互斥运行中返回 409
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 执行完成，返回执行记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryTaskRun'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/discovery/tasks/{task_id}/runs:
    get:
      tags: [discovery-tasks]
      summary: 查询任务执行记录
      operationId: listDiscoveryTaskRuns
      description: 任务执行记录分页列表（按开始时间倒序），exec 执行器含 4KB 截断的输出尾巴
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 执行记录分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryTaskRunListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/alerts:
    get:
      tags: [alerts]
      summary: 查询告警事件列表
      operationId: listAlerts
      description: 服务端检测点（如调和引擎黑设备识别、IP 扫描比对）写入的告警事件，按创建时间倒序分页返回
      parameters:
        - name: acknowledged
          in: query
          description: 按确认状态过滤（true=已确认，false=待确认；缺省返回全部）
          required: false
          schema:
            type: string
            enum: ["true", "false"]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 告警事件分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/alerts/{alert_id}/ack:
    post:
      tags: [alerts]
      summary: 确认告警事件
      operationId: ackAlert
      description: 把告警事件置为已确认（acknowledged=true），重复确认为幂等操作
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        '200':
          description: 确认成功，返回更新后的告警事件
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertEvent'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/integrations/oxidized/events:
    post:
      tags: [integrations]
      summary: Oxidized 备份/变更事件回写
      operationId: oxidizedEvent
      description: |
        Oxidized webhook 回写（F-062）：不走会话鉴权，改校验共享密钥头 X-Oxidized-Token
        （env OXIDIZED_WEBHOOK_TOKEN，默认 dev-oxidized-token，不符 401）。
        按 node 名匹配 network_device CI（name/hostname 属性）：backup 事件回写
        last_backup_at、backup_count（自增）、config_source=oxidized（同时间戳重复推送按
        last_backup_at 去重幂等）；change 事件回写 last_change_at 并写 info 级「配置变更」
        告警事件。配置原文不入库，全部写操作留审计。
      parameters:
        - name: X-Oxidized-Token
          in: header
          description: Oxidized webhook 共享密钥
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OxidizedEventRequest'
      responses:
        '200':
          description: 事件已处理（idempotent=true 表示命中幂等去重，未重复累加）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OxidizedEventResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/integrations/n9e/writeback:
    post:
      tags: [integrations]
      summary: n9e 上行回写
      operationId: n9eWriteback
      description: |
        CI 业务归属上行（F-070）：遍历 host CI，ident 匹配 n9e target 后回写
        tags（biz_group/owner/env，空格分隔 k=v，同键覆盖合并）与 note（负责人+环境）；
        无 biz_group 的主机写 info 级「治理待办：未归组主机」告警（按未确认去重）。
        n9e 连接取 credentials 表 type=n9e 的第一条（secret 含 api_url/token），
        缺则回退环境变量 N9E_API_URL/N9E_API_TOKEN。
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/N9EWritebackRequest'
      responses:
        '200':
          description: 回写结果统计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/N9EWritebackResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          description: n9e API 调用失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: n9e 未配置（无凭据且无环境变量）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/integrations/n9e/dashboard-url:
    get:
      tags: [integrations]
      summary: n9e 主机仪表盘链接
      operationId: n9eDashboardURL
      description: 前端嵌入用（F-063）：拼 n9e base + /dashboards/host?ident= 返回（会话鉴权）
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: ident
          in: query
          description: 主机标识（n9e target ident）
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 仪表盘 URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/N9EDashboardURLResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: n9e 未配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/integrations/n9e/alerts:
    get:
      tags: [integrations]
      summary: n9e 当前告警代理
      operationId: n9eAlerts
      description: |
        前端嵌入用（F-063）：代理 n9e /api/n9e/alert-cur-events?ident=，
        响应体原样透传（n9e 原始告警数组，含 severity/trigger/first_trigger_time 等字段），
        告警原文不入主库（会话鉴权）。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: ident
          in: query
          description: 主机标识（n9e target ident）
          required: true
          schema:
            type: string
      responses:
        '200':
          description: n9e 原始告警数组
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          description: n9e API 调用失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: n9e 未配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/attribution/run:
    post:
      tags: [attribution]
      summary: 应用归属引擎运行
      operationId: attributionRun
      description: |
        应用归属挂载（F-028），规则按序：a) 标签继承——host attributes.tags 含
        app=<code> 挂到 code 匹配的 biz_app；b) 业务组映射——biz_group 经 group_map
        （默认 {"电商前台":"mall-front","订单中台":"mall-order"}，可被 rules.group_map
        整体覆盖）映射 biz_app code；c) 命名规范——ident 匹配 ^([a-z0-9]+)-([a-z]+)
        取第二段经 group_map 尝试。挂接方式为 biz_app CI 建 deployed_on→host 关系，
        按三元组去重幂等；dry_run 只演练不落库。
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributionRunRequest'
      responses:
        '200':
          description: 归属运行结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributionRunResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/dashboard/quality:
    get:
      tags: [dashboard]
      summary: 数据质量看板汇总
      operationId: getQualityDashboard
      description: |
        全模型五指标汇总（F-080）：属性完整率（Core=必填属性非空占比）、关联完整率
        （有任一关系的 CI 占比；host 特化为有业务归属占比）、孤岛 CI 数、数据鲜度
        （updated_at 超 7 天占比）、监控覆盖率（monitor：CMDB 在用主机超 10 分钟
        无心跳占比；n9e 已配置时附 no_ci_pct=n9e targets 无 CMDB CI 占比）。
      responses:
        '200':
          description: 质量指标汇总
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/dashboard/quality/drilldown:
    get:
      tags: [dashboard]
      summary: 质量指标下钻缺失清单
      operationId: getQualityDrilldown
      description: 按模型与指标下钻"缺失该指标"的 CI 清单（标准分页）
      parameters:
        - name: model_id
          in: query
          description: 模型 ID 或编码
          required: true
          schema:
            type: string
        - name: metric
          in: query
          description: 指标编码
          required: true
          schema:
            type: string
            enum: [completeness, relation_completeness, orphan, stale, no_heartbeat]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 缺失 CI 分页清单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CIListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/governance/rules:
    get:
      tags: [governance]
      summary: 查询稽核规则列表
      operationId: listAuditRules
      responses:
        '200':
          description: 稽核规则列表
          content:
            application/json:
