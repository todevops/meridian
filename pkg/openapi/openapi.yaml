            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditRuleRequest'
      responses:
        '200':
          description: 修改成功，返回规则
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/governance/rules/{rule_id}/run:
    post:
      tags: [governance]
      summary: 手动执行稽核规则
      operationId: runAuditRule
      description: 立即执行一次规则：断言失败的 CI 按 (rule_id, ci_id) 去重生成待办；修复的 CI 待办自动关闭；dry_run 规则只出报告不落库
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 执行报告
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditRuleRunResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/governance/todos:
    get:
      tags: [governance]
      summary: 查询整改待办列表
      operationId: listGovernanceTodos
      parameters:
        - name: status
          in: query
          description: 按状态过滤（缺省返回全部）
          required: false
          schema:
            type: string
            enum: [open, closed]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 整改待办分页列表（附规则名，最新在前）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceTodoListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
