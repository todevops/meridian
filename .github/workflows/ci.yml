name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 前端：pnpm workspace 根即仓库根，lint/build 由 turbo 编排到 apps/web
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm 版本自动取自根 package.json 的 packageManager 字段
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  # Go 模块矩阵：server / collectors / migrator / mocks
  go-modules:
    name: Go ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [server, collectors, migrator, mocks]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
